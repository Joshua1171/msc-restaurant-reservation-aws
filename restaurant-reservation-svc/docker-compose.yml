# docker-compose.yml — restaurant-reservation-svc
# Levanta el servicio con LocalStack para desarrollo local.
# Uso:
#   docker compose up -d
#   docker compose logs -f reservation-svc
#   docker compose down
#
# Para probar contra AWS REAL en lugar de LocalStack:
#   Comentar la sección localstack y cambiar las variables de entorno
#   por las credenciales reales y SPRING_PROFILES_ACTIVE=prod

services:

  localstack:
    image: localstack/localstack:3.8
    container_name: reservation-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,sns,sqs
      - DEBUG=0
      - AWS_DEFAULT_REGION=us-east-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - reservation-net

  reservation-svc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reservation-svc
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - DYNAMODB_TABLE_NAME=restaurant-reservations
      - SNS_TOPIC_ARN=arn:aws:sns:us-east-1:000000000000:restaurant-notifications
      - COGNITO_ISSUER_URI=http://localstack:4566/us-east-1_local
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - reservation-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  reservation-net:
    driver: bridge